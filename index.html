<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealtorOne Notification Simulator</title><style>:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#5d6673;--bd:#dde1e6;--ac:#1f6feb;--wa:#dcf3e3;--su:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa3ae;--bd:#2c313a;--ac:#5b9dff;--wa:#163524;--su:#3a2b12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 0;max-width:1200px;margin:auto}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu)}
#app{max-width:1200px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 10px}.h{margin:18px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}label.tog{flex-direction:row;align-items:center;font-size:14px;color:var(--tx);gap:6px}
select,button{font:inherit;font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
button{cursor:pointer}button.pri,button.on,.views a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.day{font-weight:600;font-size:18px;padding:0 6px}
.views{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.views a{padding:7px 12px;border-radius:9px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;background:var(--card)}
.muted{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.lbl{font-size:12px;color:var(--mu);margin-bottom:6px}
.phone{max-width:360px;margin:auto;border:2px solid var(--mu);border-radius:30px;padding:12px;background:var(--bg)}
.lock{border:2px solid var(--mu);border-radius:22px;padding:12px;background:var(--bg)}
.msg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}.msg.accent{border-left:4px solid var(--ac)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.pre{white-space:pre-wrap;color:var(--mu);border-top:1px solid var(--bd);margin-top:6px;padding-top:6px}
.screen{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px;min-height:140px}.li{border-top:1px solid var(--bd);padding:4px 0;color:var(--mu)}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tabs button{font-size:12px;padding:4px 8px}
.wa{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.bubble{background:var(--wa);border-radius:12px;padding:10px;max-width:92%}.bubble .t{text-align:right;font-size:11px;color:var(--mu)}
.why{border-top:1px solid var(--bd);padding:8px 0}.pill{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:1px 6px}.why.sup .pill{background:var(--su)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}.scroll{overflow-x:auto;max-height:460px;overflow-y:auto}
.ck{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-top:1px solid var(--bd);padding:8px 0}.ck label{flex-direction:row;font-size:14px;color:var(--tx);gap:8px;flex:1 1 260px;align-items:flex-start}.ck a{color:var(--ac);font-size:13px}
ul{padding-left:18px}li{margin:4px 0}
</style></head><body><header><h1>RealtorOne Notification Simulator</h1><p>Test copy: pick a user type and payment path, step through the days, and see every message on every channel, plus what was held back and why.</p><nav class="top"><a href="./">Simulator</a><a href="./log/">Daily log</a><a href="./stats/">Stats</a><a href="./me/">What will I get?</a></nav></header><style>nav.top{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:14px}nav.top a{color:var(--ac)}</style><main id="app"></main><script src="engine.js"></script><script>
/* ---------- state & URL hash ---------- */
const DEF = { v: "sim", persona: "Ideal user", day: 1, over: {}, tab: "coach", log: "All", ramadan: false, team: false, cap: 4, tz: "Dubai (GST)", pay: "Not paid (free)" };
let S = { ...DEF };
function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, ""); }
function dec(s) { try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch (e) { return null; } }
function loadHash() { const h = location.hash.replace(/^#/, ""); const o = h ? dec(h) : null; S = { ...DEF, ...(o || {}) }; if (!PERSONAS[S.persona]) S.persona = DEF.persona; if (!PAYS.includes(S.pay)) S.pay = DEF.pay; }
function save() { const h = "#" + enc(S); if (location.hash !== h) history.replaceState(null, "", h); }
const behOf = (d) => S.over[`${S.persona}|${d}`] || PERSONAS[S.persona](d);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sel = (name, val, opts) => `<label>${esc(name.label)}<select data-k="${name.k}">${opts.map((o) => { const v = typeof o === "string" ? o : o[0]; const l = typeof o === "string" ? o : o[1]; return `<option value="${esc(v)}"${String(v) === String(val) ? " selected" : ""}>${esc(l)}</option>`; }).join("")}</select></label>`;
const tog = (label, k, val, dis) => `<label class="tog"><input type="checkbox" data-k="${k}"${val ? " checked" : ""}${dis ? " disabled" : ""}> ${esc(label)}</label>`;

/* ---------- tester checklist ---------- */
const sc = (o) => "#" + enc({ ...DEF, ...o });
const ROLES = [
  ["1. New & inactive users", [
    ["Never opens: day 1 and 2 are push only, day 4 email, day 7 WhatsApp, no welcome ever", { persona: "Never opens the app", day: 7 }],
    ["Never opens: after day 7 only one message a week (day 14, 21)", { persona: "Never opens the app", day: 21 }],
    ["Late starter: welcome appears only on day 5 (first open), welcome email shows as suppressed", { persona: "Late starter (opens day 5)", day: 5 }],
    ["Slipping user: day 3, 7, 14 re-entry messages use the realtor's own lead (Khalid)", { persona: "Active, then slips (day 8)", day: 21 }],
    ["Returns on day 23: 'Welcome back' in-app, normal daily flow resumes", { persona: "Active, then slips (day 8)", day: 23 }],
  ]],
  ["2. Payment states", [
    ["Trial: '3 days left' (day 5), 'ends tomorrow' (day 7), 'last day' (day 8), 'leads still here' (day 9)", { persona: "Ideal user", pay: "Trial, doesn't pay", day: 9 }],
    ["Trial then pays: 'All your leads are unlocked' on day 8, import email day 9, offers stop", { persona: "Ideal user", pay: "Trial, then pays", day: 12 }],
    ["Paid but inactive: calm 'Your plan is active' nudge, no offers", { persona: "Active, then slips (day 8)", pay: "Paid, then inactive", day: 12 }],
    ["Payment failed (day 11) → retry push (day 13) → expired (day 16)", { persona: "Ideal user", pay: "Paid, payment fails", day: 16 }],
    ["Cancelled (day 13) keeps access → expired (day 20); renewal reminder day 28, renewed day 31", { persona: "Ideal user", pay: "Paid, renews", day: 31 }],
  ]],
  ["3. Feature usage", [
    ["Opens but ignores features: each day promotes a different feature with a new angle", { persona: "Opens, ignores features", day: 8 }],
    ["A feature ignored twice is dropped from promotion", { persona: "Opens, ignores features", day: 14 }],
    ["Ideal user: features already used are never promoted again", { persona: "Ideal user", day: 10 }],
    ["Change 'Feature used today' and confirm tomorrow's promo changes", { persona: "Opens, ignores features", day: 3 }],
    ["No lead yet: 8 AM push asks for one name instead of a plan", { persona: "Opens, ignores features", day: 2 }],
  ]],
  ["4. Channels & duplicates", [
    ["Each channel carries one job a day (check 'Why' list: duplicates are marked Suppressed)", { persona: "Ideal user", day: 6 }],
    ["12:30 plan reminder never sends when the 8 AM plan already went out", { persona: "Active, then slips (day 8)", day: 8 }],
    ["Daily cap 3: extra messages show 'Suppressed (daily cap)'", { persona: "Ideal user", day: 8, cap: 3 }],
    ["WhatsApp always holds one objection + how to handle it today", { persona: "Ideal user", day: 4 }],
    ["Offers only after 3 active days and 4 value messages, never two days in a row", { persona: "Ideal user", day: 14 }],
  ]],
  ["5. Milestones & special situations", [
    ["Deal closed (day 21): celebrate in-app, referral email next day", { persona: "Ideal user", day: 22 }],
    ["Streak milestones at 3, 7, 14 days of logged calls", { persona: "Ideal user", day: 14 }],
    ["Course completed after 3 course sessions; team invite at 14 active days", { persona: "Ideal user", day: 15 }],
    ["Ramadan mode: sends move to 10:30 AM / after Iftar, cap 3", { persona: "Ideal user", day: 6, ramadan: true }],
    ["Public holiday + brokerage owner: lighter cap, no offers, Sunday team digest", { persona: "Ideal user", day: 7, team: true }],
  ]],
];
const CK = "r1sim-checklist";
const getCk = () => { try { return JSON.parse(localStorage.getItem(CK) || "{}"); } catch (e) { return {}; } };

/* ---------- render ---------- */
function render() {
  save();
  const app = document.getElementById("app");
  const nav = `<nav class="views"><a href="#" data-view="sim" class="${S.v === "sim" ? "on" : ""}">Simulator</a><a href="#" data-view="check" class="${S.v === "check" ? "on" : ""}">Tester checklist</a><button data-act="share">Copy scenario link</button><span id="copied"></span></nav>`;
  if (S.v === "check") {
    const ck = getCk(); let done = 0, all = 0;
    const body = ROLES.map(([role, items], r) => `<section class="card"><h2>${esc(role)}</h2>${items.map(([txt, o], i) => { const id = `${r}-${i}`; all++; if (ck[id]) done++; return `<div class="ck"><label><input type="checkbox" data-ck="${id}"${ck[id] ? " checked" : ""}> ${esc(txt)}</label> <a href="${sc(o)}" data-load="1">Open scenario</a></div>`; }).join("")}</section>`).join("");
    app.innerHTML = nav + `<p class="muted">Ticks are saved in this browser only. ${done} of ${all} checked. <button data-act="clearck">Clear ticks</button></p>` + body;
    return;
  }
  const sim = simulate(S.day, behOf, { ramadan: S.ramadan, cap: Number(S.cap), team: S.team, pay: S.pay });
  const all = sim.msgs.filter((m) => m.day === S.day), today = all.filter((m) => !m.sup);
  const b = behOf(S.day);
  const of = (c) => today.filter((m) => m.ch === c);
  const feats = [["none", "No feature used"], ...FEATS.map((f) => [f.key, f.name])];
  const card = (m) => `<div class="msg"><div class="meta"><span>RealtorOne</span><span>${esc(m.time)}</span></div><b>${esc(m.title)}</b><div>${esc(m.body)}</div></div>`;
  const ia = of("In-app");
  const logRows = sim.msgs.filter((m) => S.log === "Suppressed" ? m.sup : !m.sup && (S.log === "All" || m.ch === S.log)).slice().reverse();
  app.innerHTML = nav + `
  <section class="card"><h2>Day simulator</h2>
    <div class="row">${sel({ label: "User type", k: "persona" }, S.persona, Object.keys(PERSONAS))}${sel({ label: "Payment path", k: "pay" }, S.pay, PAYS)}
    <button data-act="prev">◀ Prev day</button><span class="day">Day ${S.day}</span><button class="pri" data-act="next">Next day ▶</button><button data-act="plus7">+7 days</button><button data-act="reset">Reset changes</button></div>
    <div class="row">${tog("Opened the app today", "opened", b.opened)}${sel({ label: "Feature used today", k: "used" }, b.used, feats)}${sel({ label: "Calls logged", k: "calls" }, b.calls, ["0", "1", "2", "3", "5"])}${sel({ label: "Lead stage (Khalid)", k: "stage" }, b.stage, STAGES)}</div>
    <div class="row">${tog("Public holiday today", "holiday", b.holiday)}${tog("Ramadan mode", "ramadan", S.ramadan)}${tog("Brokerage owner (team)", "team", S.team)}${sel({ label: "Daily cap", k: "cap" }, S.cap, ["3", "4", "5"])}${sel({ label: "Realtor's time zone", k: "tz" }, S.tz, ["Dubai (GST)", "India (IST)", "London (GMT)"])}</div>
    <p class="muted">Payment status today: <b>${esc(sim.state["Payment status"])}</b>. Changes apply to the current day and ripple forward. Khalid is sample data; figures in braces are placeholders. Times are the realtor's local time (${esc(S.tz)}); quiet hours 9 PM–8 AM; Ramadan moves sends to 10:30 AM or after Iftar.</p>
  </section>
  <h2 class="h">Day ${S.day}: what the realtor receives</h2>
  <div class="grid">
    <div><div class="lbl">App (tap a tab)</div><div class="phone"><div class="meta"><span>RealtorOne</span><span>Day ${S.day}</span></div>
      ${!b.opened ? `<div class="msg"><div class="muted">App not opened today</div>In-app messages are held until the next open.</div>` : ia.map((m) => `<div class="msg accent"><b>${esc(m.title)}</b><div>${esc(m.body)}</div></div>`).join("")}
      <div class="screen">${(SCREENS[S.tab] || []).map((l, i) => i ? `<div class="li">${esc(l)}</div>` : `<b>${esc(l)}</b>`).join("")}</div>
      <div class="tabs">${Object.keys(TABNAME).map((k) => `<button data-tab="${k}" class="${k === S.tab ? "on" : ""}">${TABNAME[k]}</button>`).join("")}</div></div></div>
    <div><div class="lbl">Lock screen (push)</div><div class="lock">${of("Push").length ? of("Push").map(card).join("") : `<div class="muted">No push today.</div>`}</div></div>
    <div><div class="lbl">Email</div>${of("Email").length ? of("Email").map((m) => `<div class="msg"><div class="muted">From: RealtorOne Coach · ${esc(m.time)}</div><b>Subject: ${esc(m.title)}</b><div class="pre">${esc(m.body)}</div></div>`).join("") : `<div class="msg muted">No email today.</div>`}</div>
    <div><div class="lbl">WhatsApp message</div><div class="wa">${of("WhatsApp").length ? of("WhatsApp").map((m) => `<div class="bubble"><b>${esc(m.title)}</b><div>${esc(m.body)}</div><div class="t">${esc(m.time)}</div></div>`).join("") : `<div class="muted">No WhatsApp today.</div>`}</div></div>
  </div>
  <section class="card"><h2>Why each message went out (or was held back) today</h2>${all.length ? all.map((m) => `<div class="why ${m.sup ? "sup" : ""}"><span class="pill">${m.sup ? "Suppressed" : esc(m.kind)}</span> <b>${esc(m.time)} · ${esc(m.ch)}: ${esc(m.title)}</b> <span class="muted">${esc(m.id)}</span><div class="muted">${esc(m.sup ? m.sup + " Planned reason: " + m.why : m.why)}</div></div>`).join("") : `<div class="muted">Nothing scheduled today.</div>`}</section>
  <section class="card"><h2>User state after today</h2><table>${Object.entries(sim.state).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></section>
  <section class="card"><h2>Message log so far</h2><div class="row seg">${["All", "In-app", "Push", "Email", "WhatsApp", "Suppressed"].map((c) => `<button data-log="${c}" class="${c === S.log ? "on" : ""}">${c}</button>`).join("")}</div>
    <div class="scroll"><table><tr><th>Day</th><th>Time</th><th>Channel</th><th>Type</th><th>Message</th><th>ID</th></tr>${logRows.map((m) => `<tr><td>${m.day}</td><td>${esc(m.time)}</td><td>${m.ch}</td><td>${esc(m.kind)}</td><td>${esc(m.title)}</td><td>${esc(m.id)}</td></tr>`).join("")}</table></div></section>
  <section class="card"><h2>Rules this simulator follows</h2><ul>
    <li><b>One message per activity:</b> each activity reaches the realtor once a day on one channel; money messages max one a day.</li>
    <li><b>One role per channel, daily cap:</b> default 4 (3 in Ramadan, 2 fewer on holidays). In-app confirmations while using the app always show.</li>
    <li><b>Priority:</b> money, then referral/team, then daily coach, then feature nudges, then value.</li>
    <li><b>Never opened:</b> re-entry only (push day 1–2, email day 4, WhatsApp day 7, then weekly). No welcome before the first open.</li>
    <li><b>Ignored feature:</b> different feature and angle next day; dropped after 2 ignores.</li>
    <li><b>Value before offers:</b> value starts after first open; offers need 3 active days, the 4:1 rule, 3-day gap, unpaid/trial/expired status, never on holidays.</li>
    <li><b>WhatsApp:</b> one objection + how to handle it today. <b>Streak</b> counts logged calls, not opens.</li>
    <li><b>Payments:</b> not paid, trial active, trial ends in 3 / 1 / 0 days, trial expired, paid active, paid but inactive, payment failed, cancelled, expired, renewed.</li>
  </ul><p class="muted">Simulation of the planned logic from the RealtorOne Notification Hub, not the live panel.</p></section>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-tab],[data-log],[data-view],[data-load]");
  if (!t) return;
  if (t.dataset.load) { e.preventDefault(); location.hash = t.getAttribute("href"); return; }
  e.preventDefault();
  const a = t.dataset.act;
  if (t.dataset.view) S.v = t.dataset.view;
  else if (t.dataset.tab) S.tab = t.dataset.tab;
  else if (t.dataset.log) S.log = t.dataset.log;
  else if (a === "prev") S.day = Math.max(1, S.day - 1);
  else if (a === "next") S.day++;
  else if (a === "plus7") S.day += 7;
  else if (a === "reset") S.over = {};
  else if (a === "clearck") localStorage.removeItem(CK);
  else if (a === "share") { const u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => { document.getElementById("copied").textContent = "Link copied"; }, () => prompt("Copy this link", u)); return; }
  render();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.ck) { const c = getCk(); c[t.dataset.ck] = t.checked; localStorage.setItem(CK, JSON.stringify(c)); render(); return; }
  const k = t.dataset.k; if (!k) return;
  const v = t.type === "checkbox" ? t.checked : t.value;
  if (k === "persona") { S.persona = v; S.day = 1; }
  else if (k === "pay") S.pay = v;
  else if (["ramadan", "team"].includes(k)) S[k] = v;
  else if (k === "cap") S.cap = Number(v);
  else if (k === "tz") S.tz = v;
  else {
    const b = behOf(S.day); const p = { ...b };
    if (k === "opened") { p.opened = v; if (!v) { p.used = "none"; p.calls = 0; } }
    else if (k === "calls") p.calls = Number(v); else p[k] = v;
    S.over = { ...S.over, [`${S.persona}|${S.day}`]: p };
  }
  render();
});
window.addEventListener("hashchange", () => { loadHash(); render(); });
loadHash(); render();

</script></body></html>
