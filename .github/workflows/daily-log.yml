name: Daily notification log
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/daily.js
      - id: tests
        run: node tests/run.js
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/log.json data/tests.json
          git diff --cached --quiet || git commit -m "Daily log + tests $(date -u +%F)"
          git push
      - if: steps.tests.outcome == 'failure'
        run: echo "Rule checks failed, see data/tests.json" && exit 1
